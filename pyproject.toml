[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gould_2026"
version = "0.1.0"
description = "Code for gould_2026"
requires-python = ">=3.10"
dependencies = [
    "jax[cuda12]",
    "jaxopt",
    "numpy",
    "scipy",
    "pyyaml",
    "frozendict",
    "tqdm",
    "matplotlib",
    "python-picard",
    "mmica@git+https://github.com/draeloslab/mmica",
    "torch",
    "vjf@git+https://github.com/draeloslab/vjf.git@allow_deepcopy",
    "datahugger",
    "dandi",
    "h5py",
    "pynwb",
    "scikit-image",
    "adjustText",
    "fsspec",
    "requests",
    "aiohttp",
    "pims",
    "av",
    "seaborn",
    "pandas",
    "jupyter",
    "ipympl",
    "nbval",
    "pyqt6",
    "papermill",
    "tabulate",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gould_2026*"]

[tool.setuptools.package-dir]
"" = "src"




[tool.yapf]
based_on_style='facebook'
ARITHMETIC_PRECEDENCE_INDICATION=true
SPLIT_BEFORE_NAMED_ASSIGNS=true
SPACE_BETWEEN_ENDING_COMMA_AND_CLOSING_BRACKET=false
COALESCE_BRACKETS=true
COLUMN_LIMIT=300

[tool.yapfignore]
ignore_patterns=[
    "workspace/datasets/*"
]

[tool.isort]
line_length = 300
skip_glob = ['workspace/datasets/*', '*/.*']

[tool.coverage.report]
exclude_also = [
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if False:",
    "if .TYPE_CHECKING.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.run]
source = [
    "gould_2026",
    "figure_code",
]
omit = [
    "data",
    "*/.*/*"
]
data_file = "output/.coverage"

[tool.coverage.html]
directory = "output/reports/coverage-html"

[tool.coverage.xml]
output = "output/reports/coverage.xml"
